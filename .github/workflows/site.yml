name: Site

# Type check, tests and the production build for the React site, the shared test cases
# and vocabulary in wp-content/plugins/firehouse/shared, and checks that the project and
# topic schemas and the plugin's stylesheet (assets/css/firehouse.css), icons, logos and
# link-preview image are current. It runs on any change to the plugin too: some of its
# tests read the plugin's PHP, blocks and scripts (scripts/plugin-css.test.mjs,
# fonts.test.mjs, block-editor.test.mjs).

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'wp-content/plugins/firehouse/**'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'wp-content/plugins/firehouse/**'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      # No step pushes, so the job's token isn't left in .git/config for later steps.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Project schema is current
        run: npm run schema:check

      - name: Plugin stylesheet is current
        run: npm run plugin:css:check

      - name: Plugin icons and logos are current
        run: npm run plugin:assets:check

      - name: Production build
        run: npm run build
