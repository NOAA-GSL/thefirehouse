name: Site

# Type check and tests for the React site, the shared test cases and vocabulary in
# wp-content/plugins/firehouse/shared, and a check that the project schema is current.

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'wp-content/plugins/firehouse/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'wp-content/plugins/firehouse/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Project schema is current
        run: npm run schema:check
