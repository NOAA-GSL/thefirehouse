    - text: Testbed Evaluation
    - 'heading "Fire Weather Testbed Evaluations #002: Fire Detection and Dissemination - NESDIS Next Generation Fire System and NWS Hotspot Notification Tool" [level=1]'
    - paragraph: Emily Wells, Ansley Baring, Benjamin Hatchett, Stephanie Hoekstra, Laura Sample McMeeking, Kyle Thiem, Zach Tolby and Jamie Vickery·Cooperative Institute for Research in the Atmosphere
    - text: "Completed 2025 Fire cycle phase: Before · During · Long-term"
    - heading "Abstract" [level=2]
    - paragraph: In June 2024, the NOAA Fire Weather Testbed conducted a five-day, in-person evaluation of the National Environmental Satellite, Data, and Information Service (NESDIS) Next Generation Fire System (NGFS) and NWS Hotspot Notification Tool (HSNT). NGFS is a satellite-based AI algorithm utilizing NOAA’s geostationary and low Earth-orbiting satellites to detect and monitor wildland fires, highlighting potential new ignitions. It is developed jointly by NESDIS and the University of Wisconsin Space Science and Engineering Center’s Cooperative Institute for Meteorological Satellite Studies. HSNT, developed by NWS Norman, Oklahoma, disseminates fire detection locations and weather forecasts from NWS meteorologists to land management partners via text or email notifications. Four meteorologists and five state fire partners participated in the evaluation. After receiving NGFS and HSNT training, meteorologist–land manager pairs worked together on displaced real-time simulations. Participants completed daily surveys regarding NGFS usage during simulations and joined a final focus group to evaluate overall usability and utility. FWT facilitated two recorded focus group discussions—one for meteorologists and one for fire partners—allowing each group to focus on discipline-specific applications and feedback. The FWT analyzed their feedback to share with the product development team.
    - heading "Major takeaways" [level=2]
    - list:
      - listitem:
        - paragraph: The publicly accessible NGFS provides utility as a fire detection and monitoring tool. It enhances situational awareness, serving as a safety net for forecasters. By incorporating NGFS detections, the HSNT adds capabilities for the NWS to alert partner agencies. The NGFS and HSNT should integrate effectively into NWS operational environments.
      - listitem:
        - paragraph: By incorporating NGFS detections, the HSNT adds capabilities for the NWS to alert partner agencies. Evaluation findings suggested that the NGFS and HSNT can integrate effectively into NWS operational environments.
      - listitem:
        - paragraph: The publicly available NGFS/HSNT notification tools were perceived as not resource intensive and therefore capable of filling needs, especially for resource-limited land management jurisdictions. Because it is publicly available, land management agencies could integrate NGFS into their own operational environments or GIS platforms.
      - listitem:
        - paragraph: Participating meteorologists and land managers found that the NGFS’ high temporal resolution enhanced situational awareness for monitoring wildland fires (wildfire and prescribed).
    - heading "End-user needs and recommendations" [level=2]
    - list:
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for “safety net” tools among meteorologists:"
          - text: Automated "safety net" tools (like NGFS) are needed to monitor active fires and prevent missed detections, reducing cognitive overload during operations.
        - text: Recommendation
        - paragraph: Recommend ingesting NGFS into NWS Advanced Weather Interactive Processing System (AWIPS) with customizable display capabilities (e.g., hotspot detections overlaid with base satellite, meteorological, geographical data) and fire radiative power color-coding to help meteorologists differentiate new ignitions from known/older thermal activity.
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for contextual data and weather overlays among land managers:"
          - text: Land managers need contextual data, confidence indicators, and representative weather observations alongside hotspot detections to validate thermal anomalies and reduce concerns over false positive detections.
        - text: Recommendation
        - paragraph: Recommend training materials and documentation that explain the NGFS process (e.g., how it detects fires, integrates known wildland fire information, and incorporates uncertainty) to support land managers in validating detections with other sources.
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for controlled fire detection information flows among meteorologists and land managers:"
          - text: Both groups need information flows to notify land management partners about critical hotspot detections without overwhelming them with unnecessary data.
        - text: Recommendation
        - paragraph: Recommend adding a confirmation mechanism to “close the loop” between meteorologists and partner agencies to confirm receipt of NWS-provided hotspot notification(s).
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for multi-modal communication options between meteorologists and land managers:"
          - text: Land managers need flexible, multi-modal communication options (including via text message) to ensure time-sensitive hotspot alerts reach field partners reliably despite internet connectivity constraints.
        - text: Recommendation
        - paragraph: Recommend ensuring multiple communication pathways are available for agency partners to use to send and receive NGFS/HSNT as needed.
