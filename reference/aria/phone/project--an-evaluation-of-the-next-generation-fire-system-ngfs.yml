    - text: Testbed Evaluation
    - heading "An Evaluation of the Next Generation Fire System (NGFS) for Predictive Services" [level=1]
    - paragraph: Laura McMeeking, Ansley Baring, Benjamin J. Hatchett, Laura B. Sample McMeeking, Phil Schumacher and and Kyle J. Thiem·CIRA / NOAA Fire Weather Testbed
    - text: "Completed 2025 Fire cycle phase: Before · During"
    - heading "Abstract" [level=2]
    - paragraph: This evaluation by the NOAA Fire Weather Testbed assesses the Next Generation Fire System (NGFS) for wildland fire Predictive Services personnel. Based on a May 2025 evaluation with six interagency specialists, NGFS’s high temporal resolution and Fire Radiative Power (FRP) data significantly enhance situational awareness and early wildfire verification. While participants praised its rapid cadence, operational adoption is hindered by usability friction, such as map navigation challenges and visual ambiguities between wildfires and non-fire heat sources like solar arrays. Predictive Services relies on a "trust but verify" workflow across multiple tools; thus, standalone systems risk becoming "one more tab to check". Key recommendations include exposing robust APIs to integrate NGFS data directly into existing Common Operating Platforms, implementing push alerts and user-defined watchboxes, improving visual differentiation of event types, and delivering role-specific training.
    - heading "Major takeaways" [level=2]
    - list:
      - listitem:
        - paragraph: NGFS’s high temporal resolution and rapid 5-minute data cadence significantly enhance situational awareness, enabling fast verification of unconfirmed initial wildfire reports.
      - listitem:
        - paragraph: Operational adoption is hindered by map navigation friction and visual ambiguities, such as misidentifying solar arrays or prescribed burns as wildfires.
      - listitem:
        - paragraph: To avoid becoming "one more tab to check," NGFS data needs robust API integration into existing Common Operating Platforms and automated push notifications.
    - heading "End-user needs and recommendations" [level=2]
    - list:
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for efficient fire activity verification among wildland fire analysts and intelligence coordinators:"
          - text: Distinguishing unplanned wildfires from planned prescribed burns or non-fire thermal anomalies is a slow, manual process dependent on checking scattered agency databases.
      - listitem:
        - text: Recommendation
        - paragraph: Recommend establishing consistent, cross-agency standards for reporting planned fire activity and authorized ignitions to enable rapid identification.
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for proactive fire detection notifications among fire managers and dispatchers:"
          - text: Actively monitoring multiple dashboards continuously creates operational friction in busy, shared workspaces where attention is divided.
      - listitem:
        - text: Recommendation
        - paragraph: Recommend designing fire detection systems to deliver automated, push-based alerts tailored to specific user roles and geographic areas of responsibility.
      - listitem:
        - text: Need
        - paragraph:
          - strong: "Need for precise detection geolocations among wildland fire dispatchers and regional response agencies:"
          - text: Coarse or imprecise satellite detection locations make it difficult to determine which side of a jurisdictional boundary a fire is on, delaying response decisions near federal, state, and tribal borders.
