  - region "Have a finding to share?":
    - heading "Have a finding to share?" [level=2]
    - paragraph: Describe what you learned in your own words. Submissions are reviewed and folded into the four topic areas above.
    - link "Submit a Finding (opens in a new tab)":
      - /url: https://docs.google.com/forms/d/e/1FAIpQLSfekqxdzqRyZQkYAZVibY9BzhpWzQVDxMVOffunkZ5EnmF4Ww/viewform
  - paragraph: Researchers inside and outside NOAA submit the projects on this site. Their findings and opinions are their own and do not necessarily reflect the views of NOAA or the U.S. Department of Commerce.
